<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudia para tu PAES 2026/7 — Ciencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #fae0e9;
  --bg-2: #f3cee0;
  --paper: #fbf2e6;
  --paper-dim: #f5e6cf;
  --ink: #6b4a10;
  --cream: #7a5710;
  --muted: #96701f;
  --muted-2: #8f6a1e;
  --amber: #d4af37;
  --amber-dim: #b8912a;
  --amber-text: #96701f;
  --blush: #e6a8c4;
  --teal: #8fae6e;
  --rust: #c1476a;
  --line: rgba(122,74,16,0.15);
  --line-strong: rgba(122,74,16,0.32);
  --radius: 14px;
  --shadow: 0 20px 50px -20px rgba(150,70,95,0.32);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(212,175,55,0.18), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(193,71,106,0.10), transparent 60%),
    var(--bg);
  color:var(--cream);
  font-family:'Source Serif 4', Georgia, serif;
  min-height:100vh;
  position:relative;
}
/* subtle hexagonal "cell wall" texture */
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.4;
  background-image:
    linear-gradient(30deg, rgba(122,74,16,0.035) 12%, transparent 12.5%, transparent 87%, rgba(122,74,16,0.035) 87.5%, rgba(122,74,16,0.035)),
    linear-gradient(150deg, rgba(122,74,16,0.035) 12%, transparent 12.5%, transparent 87%, rgba(122,74,16,0.035) 87.5%, rgba(122,74,16,0.035)),
    linear-gradient(30deg, rgba(122,74,16,0.035) 12%, transparent 12.5%, transparent 87%, rgba(122,74,16,0.035) 87.5%, rgba(122,74,16,0.035)),
    linear-gradient(150deg, rgba(122,74,16,0.035) 12%, transparent 12.5%, transparent 87%, rgba(122,74,16,0.035) 87.5%, rgba(122,74,16,0.035));
  background-size: 64px 112px;
  background-position: 0 0, 0 0, 32px 56px, 32px 56px;
}
h1,h2,h3,.display{ font-family:'Fraunces', serif; letter-spacing:-0.01em; }
.mono, .eyebrow, button, .tag, .timer, .pct{ font-family:'Space Grotesk', 'IBM Plex Mono', monospace; }
.wrap{ position:relative; z-index:1; max-width:1080px; margin:0 auto; padding: 40px 24px 120px; }
.hidden{ display:none !important; }

/* ---------- Top bar ---------- */
.topbar{
  position:relative; z-index:2;
  display:flex; align-items:center; justify-content:space-between;
  max-width:1080px; margin:0 auto; padding:20px 24px 0;
}
.brand{ display:flex; align-items:center; gap:10px; font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; font-size:13px; color:var(--muted); }
.brand .dot{ width:10px; height:10px; border-radius:50%; background:conic-gradient(var(--amber-dim), var(--amber), #f3d78a, var(--amber-dim)); }
.nav-actions{ display:flex; gap:10px; }
.nav-btn{
  background:transparent; border:1px solid var(--line-strong); color:var(--cream);
  padding:8px 14px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:500;
  transition:all .15s ease; display:flex; align-items:center; gap:6px;
}
.nav-btn:hover{ background:rgba(122,74,16,0.08); border-color:var(--cream); }
.nav-btn:focus-visible, button:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--amber-text); outline-offset:2px; }

/* ---------- Home ---------- */
.hero{ text-align:center; padding: 64px 0 8px; }
.hero .eyebrow{
  display:inline-flex; align-items:center; gap:8px; color:var(--amber-text); font-size:12px; letter-spacing:0.16em; text-transform:uppercase; margin-bottom:18px;
}
.hero .eyebrow::before, .hero .eyebrow::after{ content:"◆"; font-size:8px; color:var(--amber-dim); }
.hero h1{
  font-size: clamp(2.4rem, 6vw, 4.4rem); font-weight:900; margin:0; line-height:1.02;
  background:linear-gradient(120deg, var(--ink) 12%, var(--amber) 55%, #f6dfa0 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero .sub{ margin-top:18px; font-family:'Space Grotesk',sans-serif; font-size:15px; color:var(--muted); text-transform:lowercase; letter-spacing:0.02em; }

.cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:56px; }
@media (max-width:820px){ .cards{ grid-template-columns:1fr; } }
.card{
  position:relative; background:linear-gradient(160deg, var(--paper), var(--paper-dim));
  color:var(--ink); border-radius:var(--radius); padding:28px 24px 26px; text-align:left;
  cursor:pointer; border:none; box-shadow:var(--shadow); overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease;
  font-family:inherit;
}
.card:hover{ transform:translateY(-6px); box-shadow:0 26px 60px -18px rgba(150,70,95,0.4); }
.card .tag{ font-size:11px; text-transform:uppercase; letter-spacing:0.14em; color:var(--muted-2); font-weight:600; }
.card h2{ margin:10px 0 8px; font-size:1.5rem; }
.card p{ margin:0; font-size:14px; color:#5f4410; line-height:1.5; }
.card .icon{
  position:absolute; right:-18px; top:-18px; width:88px; height:88px; border-radius:50%;
  opacity:0.5;
}
.card.c1 .icon{ background:radial-gradient(circle at 35% 35%, var(--amber), transparent 70%); }
.card.c2 .icon{ background:radial-gradient(circle at 35% 35%, var(--blush), transparent 70%); }
.card.c3 .icon{ background:radial-gradient(circle at 35% 35%, var(--amber-dim), transparent 70%); }
.card .go{ margin-top:18px; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--ink); }

/* ---------- Section shell ---------- */
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:28px; }
.section-head h2{ font-size:2rem; margin:0; }
.section-head .note{ color:var(--muted); font-size:13px; font-family:'Space Grotesk',sans-serif; }
.crumbs{ display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap; }

/* ---------- Grid of options / units ---------- */
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:16px; }
.tile{
  background:rgba(255,255,255,0.55); border:1px solid var(--line); border-radius:12px;
  padding:20px; cursor:pointer; text-align:left; color:var(--cream); font-family:inherit;
  transition:all .15s ease; position:relative;
}
.tile:hover:not(.locked){ border-color:var(--amber); background:rgba(212,175,55,0.16); transform:translateY(-3px); }
.tile.locked{ opacity:0.45; cursor:not-allowed; }
.tile .num{ font-family:'Space Grotesk',sans-serif; font-size:11px; color:var(--amber-text); text-transform:uppercase; letter-spacing:0.1em; }
.tile h3{ font-size:1.05rem; margin:8px 0 6px; font-family:'Fraunces',serif; font-weight:600; }
.tile .meta{ font-size:12px; color:var(--muted); font-family:'Space Grotesk',sans-serif; }
.tile .badge{ position:absolute; top:14px; right:14px; font-size:16px; }

/* ---------- Buttons ---------- */
.btn{
  font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; border-radius:999px;
  padding:12px 22px; border:none; cursor:pointer; transition:all .15s ease; display:inline-flex; align-items:center; gap:8px;
}
.btn-primary{ background:var(--amber); color:#2b1a05; }
.btn-primary:hover{ background:#e2c065; transform:translateY(-2px); }
.btn-secondary{ background:transparent; border:1px solid var(--line-strong); color:var(--cream); }
.btn-secondary:hover{ background:rgba(122,74,16,0.08); }
.btn-teal{ background:var(--teal); color:#16240f; }
.btn-teal:hover{ background:#a8c98f; }
.btn:disabled{ opacity:0.4; cursor:not-allowed; }
.btn-row{ display:flex; gap:12px; flex-wrap:wrap; margin-top:28px; }

/* ---------- Count selector (ensayo setup) ---------- */
.count-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin:28px 0 8px; }
@media (max-width:700px){ .count-grid{ grid-template-columns:repeat(3,1fr); } }
.count-opt{
  background:rgba(255,255,255,0.55); border:1px solid var(--line); border-radius:12px;
  padding:20px 10px; text-align:center; cursor:pointer; color:var(--cream); font-family:'Space Grotesk',sans-serif;
  transition:all .15s ease;
}
.count-opt .n{ font-size:1.8rem; font-weight:700; display:block; font-family:'Fraunces',serif; }
.count-opt .l{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
.count-opt:hover, .count-opt.selected{ border-color:var(--amber); background:rgba(212,175,55,0.18); }
.count-opt.selected{ box-shadow:0 0 0 2px var(--amber) inset; }

/* ---------- Study content ---------- */
.study-card{ background:linear-gradient(160deg, var(--paper), var(--paper-dim)); color:var(--ink); border-radius:var(--radius); padding:32px 30px; box-shadow:var(--shadow); }
.study-card h3{ font-size:1.5rem; margin-top:0; color:#4a3208; }
.study-card p{ line-height:1.75; font-size:15.5px; color:#5f4410; }
.study-card ul{ line-height:1.75; font-size:15.5px; color:#5f4410; padding-left:22px; }
.study-card strong{ color:#3d2a06; }
.locked-note{ background:rgba(193,71,106,0.14); border:1px solid rgba(193,71,106,0.4); color:#7a1f3d; padding:14px 18px; border-radius:10px; font-family:'Space Grotesk',sans-serif; font-size:13.5px; }

/* ---------- Figures / diagrams within study content ---------- */
.fig{ margin:26px 0; text-align:center; }
.fig .fig-frame{ background:linear-gradient(160deg, rgba(255,255,255,0.55), rgba(255,255,255,0.28)); border:1px solid var(--line); border-radius:14px; padding:14px; display:inline-block; max-width:100%; box-shadow:0 10px 26px -14px rgba(150,70,95,0.28); }
.fig img, .fig svg{ max-width:100%; width:100%; height:auto; display:block; border-radius:6px; }
.fig svg{ min-width:280px; }
.fig figcaption{ margin-top:11px; font-family:'Space Grotesk',sans-serif; font-size:12.3px; color:var(--muted); font-style:italic; line-height:1.5; padding:0 12px; }

/* ---------- Worked example box ---------- */
.example-box{ background:rgba(143,174,110,0.12); border:1px solid rgba(143,174,110,0.42); border-left:4px solid var(--teal); border-radius:10px; padding:16px 20px; margin:20px 0; }
.example-box .ex-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em; color:#3f5c2c; margin:0 0 10px; display:flex; align-items:center; gap:7px; }
.example-box .ex-title::before{ content:"✎"; font-size:13px; }
.example-box p{ font-size:14.5px; margin:8px 0; }
.example-box ul{ font-size:14.5px; }
.example-box .calc{ font-family:'IBM Plex Mono',monospace; background:rgba(255,255,255,0.6); padding:11px 14px; border-radius:7px; margin:10px 0; font-size:13.3px; line-height:1.75; overflow-x:auto; color:#3d2a06; border:1px solid rgba(122,74,16,0.12); }
.example-box .calc .r{ color:#4a6b32; font-weight:600; }

/* ---------- Key note / atención box ---------- */
.note-box{ background:rgba(212,175,55,0.13); border:1px solid rgba(212,175,55,0.45); border-left:4px solid var(--amber); border-radius:10px; padding:14px 20px; margin:20px 0; }
.note-box .nb-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--amber-text); margin:0 0 6px; }
.note-box p{ font-size:14px; margin:6px 0; }

/* ---------- Compact reference table inside study content ---------- */
.study-card table.ref-table{ width:100%; border-collapse:collapse; margin:18px 0; font-size:13.8px; }
.study-card table.ref-table th{ background:rgba(122,74,16,0.09); color:#4a3208; font-family:'Space Grotesk',sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; padding:9px 12px; text-align:left; border-bottom:2px solid var(--line-strong); }
.study-card table.ref-table td{ padding:9px 12px; border-bottom:1px solid var(--line); color:#5f4410; vertical-align:top; }
.study-card table.ref-table tr:last-child td{ border-bottom:none; }
.study-card table.ref-table td strong{ color:#3d2a06; }

/* ---------- Concept/definition box (glosario de términos) ---------- */
.concept-box{ background:rgba(230,168,196,0.15); border:1px solid rgba(230,168,196,0.55); border-left:4px solid var(--blush); border-radius:10px; padding:16px 20px; margin:20px 0; }
.concept-box .cx-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em; color:#9c3d68; margin:0 0 10px; }
.concept-box p{ font-size:14px; margin:6px 0; }
.concept-box dl{ margin:6px 0 0; }
.concept-box dt{ font-family:'Fraunces',serif; font-weight:700; color:#7a1f4d; font-size:14.5px; margin-top:12px; }
.concept-box dt:first-child{ margin-top:0; }
.concept-box dd{ margin:3px 0 0 0; font-size:13.7px; color:#5f4410; line-height:1.6; }

/* ---------- Quiz ---------- */
.quiz-meta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
.timer{ background:rgba(193,71,106,0.15); border:1px solid rgba(193,71,106,0.4); color:#7a1f3d; padding:8px 16px; border-radius:999px; font-weight:600; font-size:14px; }
.timer.warn{ background:rgba(212,175,55,0.22); border-color:var(--amber); color:var(--amber-text); animation:pulse 1s infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.55;} }
.qcard{ background:rgba(255,255,255,0.55); border:1px solid var(--line); border-radius:12px; padding:22px 22px 18px; margin-bottom:16px; }
.qcard .qnum{ font-family:'Space Grotesk',sans-serif; font-size:12px; color:var(--amber-text); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:6px; }
.qcard .qtext{ font-size:17px; line-height:1.5; margin-bottom:16px; font-weight:500; }
.opt{
  display:flex; align-items:flex-start; gap:10px; padding:11px 14px; border-radius:8px; margin-bottom:8px;
  border:1px solid var(--line); cursor:pointer; transition:all .12s ease; font-size:14.5px; line-height:1.5;
}
.opt:hover{ border-color:var(--muted); background:rgba(255,255,255,0.4); }
.opt input{ margin-top:3px; accent-color:var(--amber); }
.opt.chosen{ border-color:var(--amber); background:rgba(212,175,55,0.16); }
.opt.correct{ border-color:var(--teal); background:rgba(143,174,110,0.2); }
.opt.wrong{ border-color:var(--rust); background:rgba(193,71,106,0.16); }
.opt .letter{ font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--muted); min-width:18px; }
.result-tag{ display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px; }
.result-tag.ok{ background:rgba(143,174,110,0.25); color:#4a6b32; }
.result-tag.bad{ background:rgba(193,71,106,0.22); color:#8a1f3d; }
.explain{ margin-top:12px; padding:12px 14px; background:rgba(255,255,255,0.5); border-left:3px solid var(--amber); border-radius:6px; font-size:13.5px; line-height:1.55; color:var(--muted); }
.explain strong{ color:var(--cream); }
.submit-bar{ position:sticky; bottom:18px; display:flex; justify-content:center; margin-top:24px; z-index:5; }
.submit-inner{ background:var(--bg-2); border:1px solid var(--line-strong); border-radius:999px; padding:12px 12px 12px 20px; display:flex; align-items:center; gap:16px; box-shadow:var(--shadow); }
.progress-inline{ font-family:'Space Grotesk',sans-serif; font-size:12.5px; color:var(--muted); }

/* ---------- Results summary ---------- */
.score-hero{ text-align:center; padding:20px 0 36px; }
.score-ring{ width:150px; height:150px; margin:0 auto 18px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; }
.score-ring .num{ font-family:'Fraunces',serif; font-size:2.2rem; font-weight:700; color:var(--cream); }
.score-ring .lbl{ font-size:11px; color:var(--muted); }

/* ---------- Progress page ---------- */
.prog-block{ background:rgba(255,255,255,0.55); border:1px solid var(--line); border-radius:12px; padding:22px; margin-bottom:16px; }
.prog-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:12px; flex-wrap:wrap; }
.prog-top h3{ margin:0; font-size:1.1rem; }
.bar-track{ width:100%; height:10px; border-radius:999px; background:rgba(122,74,16,0.13); overflow:hidden; }
.bar-fill{ height:100%; background:linear-gradient(90deg, var(--amber-dim), var(--amber)); border-radius:999px; transition:width .4s ease; }
.pct{ font-weight:700; color:var(--amber-text); font-size:14px; cursor:default; }
.subrow{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); font-family:'Space Grotesk',sans-serif; margin-top:8px; }
.ensayo-row{ display:flex; justify-content:space-between; padding:10px 4px; border-bottom:1px solid var(--line); font-size:13.5px; font-family:'Space Grotesk',sans-serif; }
.ensayo-row:last-child{ border-bottom:none; }
.empty-note{ color:var(--muted); font-size:13.5px; font-family:'Space Grotesk',sans-serif; padding:6px 0; }

/* ---------- Footer signature ---------- */
.signature{
  position:fixed; right:18px; bottom:14px; z-index:20;
  font-family:'Space Grotesk',sans-serif; font-size:11.5px; color:var(--muted-2);
  text-align:right; line-height:1.5; pointer-events:none; opacity:0.85;
}
.signature b{ color:var(--amber-text); }

@media (max-width:600px){
  .wrap{ padding:24px 16px 110px; }
  .topbar{ padding:16px 16px 0; }
  .hero{ padding:36px 0 4px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> Herbario PAES · Ciencias</div>
  <div class="nav-actions" id="navActions"></div>
</div>

<div class="wrap" id="app"></div>

<div class="signature">te ama, diddier,<br><b>tú puedes!!</b></div>

<script src="./app.js"></script>
</body>
</html>
